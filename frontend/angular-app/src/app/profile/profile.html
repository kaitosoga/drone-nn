<div class="test-container">
  <h1>AI Pilots Test Lab</h1>

  <section class="auth-box">
    <h3>Authentication</h3>
    <input [(ngModel)]="username" placeholder="Username" (keydown.enter)="onLogin()"/> <!--ng key detection inside input field-->
    <input [(ngModel)]="password" type="password" placeholder="Password" (keydown.enter)="onLogin()"/> 
    <input [(ngModel)]="displayName" placeholder="Display Name (Reg only)" />
    <br><br>
    <button (click)="onLogin()">Login</button>
    <button (click)="onRegister()">Register</button>
    <button (click)="onLogout()">Logout</button>

    @if (loggedIn()) {<p>Logged in as {{displayNameLogged}}</p>} @else {<p>Not logged in</p>}
  </section>
</div>
