<div class="container">
  <div class="header">
    <h1>Profile</h1>
  </div>

  <div class="auth-section">
    <div class="toggle-section">
      <span [class.active]="!isRegisterMode">Login</span>
      <button class="toggle" (click)="isRegisterMode = !isRegisterMode" [attr.data-mode]="isRegisterMode ? 'register' : 'login'">
        <div class="slider"></div>
      </button>
      <span [class.active]="isRegisterMode">Register</span>
    </div>

    <div class="form">
      <input [(ngModel)]="username" placeholder="Username" (keydown.enter)="isRegisterMode ? onRegister() : onLogin()">
      <input [(ngModel)]="password" type="password" placeholder="Password" (keydown.enter)="isRegisterMode ? onRegister() : onLogin()">
      <input *ngIf="isRegisterMode" [(ngModel)]="displayName" placeholder="Display Name" (keydown.enter)="onRegister()">
      
      <button *ngIf="!isRegisterMode" (click)="onLogin()" class="primary">Login</button>
      <button *ngIf="isRegisterMode" (click)="onRegister()" class="primary">Register</button>
      <button *ngIf="loggedIn()" (click)="onLogout(false)" class="secondary">Logout</button>
    </div>

    <div class="status">
      @if (loggedIn()) {<p class="logged-in">Logged in as <strong>{{displayNameLogged}}</strong></p><br><p>Topscores:<br>Human: {{topscoreH}}<br>Custom: {{topscoreC}}</p>} 
      @else {<p class="logged-out">Not logged in</p>}
    </div>
    <button class="router" routerLink="/game">Play the Game</button>
  </div>
</div>
