<div class="container">
  <div class="header">
    <h1>Leaderboard</h1>
    <p>Top 10 players</p>
  </div>

  <div class="toggle-section">
    <span [class.active]="mode === 'human'">Human</span>
    <button class="toggle" (click)="toggleMode()" [attr.data-mode]="mode">
      <div class="slider"></div>
    </button>
    <span [class.active]="mode === 'custom'">Custom</span>
  </div>

  <ol class="leaderboard" *ngIf="leaderboard">
    <li *ngFor="let player of leaderboard" class="entry">
      <span class="name">{{ player.name }}</span>
      <span class="score">{{ player.score }}</span>
      <button *ngIf="mode === 'custom'" (click)="challengePlayer(player.user_id)" class="challenge">Challenge</button>
    </li>
  </ol>
</div>
