<div class="container">
  <div class="header">
    <h1>Drone Skins</h1>
    <p>Choose your drone appearance.</p>
  </div>

  <div class="skins-grid">
    <div class="skin-card" 
      (click)="setSkin('public/skins/drone-skin1.png')"
      [class.selected]="gameService.skinPath === 'public/skins/drone-skin1.png'">
      <img src="public/skins/drone-skin1.png" alt="Skin 1">
      <span class="label">Drone Alpha</span>
    </div>
    <div class="skin-card" 
      (click)="setSkin('public/skins/drone-skin2.png')"
      [class.selected]="gameService.skinPath === 'public/skins/drone-skin2.png'">
      <img src="public/skins/drone-skin2.png" alt="Skin 2">
      <span class="label">Drone Beta</span>
    </div>
    <div class="skin-card" 
      (click)="setSkin('public/skins/camera-drone2.png')"
      [class.selected]="gameService.skinPath === 'public/skins/camera-drone2.png'">
      <img src="public/skins/camera-drone2.png" alt="Skin 3">
      <span class="label">Drone Gamma</span>
    </div>
  </div>
  <button routerLink="/game">Play the Game</button>
</div>
<div class="info">
    <details style="color: black;">
        <summary>attributions</summary>
        <br><a style="color: black;" href="https://ezremove.ai/image-to-image/">some images generated on https://ezremove.ai</a>

        <a style="color: black;" href="https://www.vecteezy.com/free-png/drone">Drone PNGs by Vecteezy</a>
    </details>
</div>
