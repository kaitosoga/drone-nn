<div class="container">
  <div class="header">
    <h1>Drone Skins</h1>
    <p>Choose your drone appearance.</p>
  </div>

  <div class="skins-grid">
    <div class="skin-card" 
      (click)="setSkin('public/skins/camera-drone.png')"
      [class.selected]="gameService.skinPath === 'public/skins/camera-drone.png'">
      <img src="public/skins/camera-drone.png" alt="Skin 1">
      <span class="label">Drone Alpha</span>
    </div>
    <div class="skin-card" 
      (click)="setSkin('public/skins/camera-drone1.png')"
      [class.selected]="gameService.skinPath === 'public/skins/camera-drone1.png'">
      <img src="public/skins/camera-drone1.png" alt="Skin 2">
      <span class="label">Drone Beta</span>
    </div>
    <div class="skin-card" 
      (click)="setSkin('public/skins/camera-drone2.png')"
      [class.selected]="gameService.skinPath === 'public/skins/camera-drone2.png'">
      <img src="public/skins/camera-drone2.png" alt="Skin 3">
      <span class="label">Drone Gamma</span>
    </div>
  </div>
  <button routerLink="/game">Play the Game</button>
</div>
